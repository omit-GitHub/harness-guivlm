[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-framework"
version = "0.1.0"
description = "VLM 决策与真实设备执行之间的确定性安全边界框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GUIAgent Team" }]
keywords = ["agent", "harness", "vlm", "android", "safety", "guard", "verifier"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# 本地 OCR（可选）：未安装时 ScreenshotObservationAdapter 降级为 OCR unavailable。
# RapidOCR 为本地 ONNX OCR（非 VLM / 非云端 API），模型随包自带。
ocr = [
    "rapidocr_onnxruntime==1.2.3",
]
# 云端 VLM 决策（可选）：DashScope qwen-vl。未安装 / 无 key 时 VLM 决策标为失败，不伪造。
vlm = [
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/omit-GitHub/Agent-project"
Documentation = "https://github.com/omit-GitHub/Agent-project/blob/main/harness-framework/HARNESS_DESIGN.md"
Repository = "https://github.com/omit-GitHub/Agent-project"
Issues = "https://github.com/omit-GitHub/Agent-project/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
